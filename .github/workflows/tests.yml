name: Python tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e '.[test]'
      - run: python -m pytest tests/ -q
      - run: python -m compileall -q src
      - name: Explicit offline hierarchical smoke test
        run: >-
          python -m jev_factorio --controller hierarchical --backend mock
          --mock-model --target bootstrap_mining --steps 40 --tick-seconds 0
          --checkpoint /tmp/campaign.json --log-file /tmp/campaign.jsonl
      - run: python -m jev_factorio.evaluation /tmp/campaign.jsonl
  research-export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e '.[evaluation]' pytest duckdb
      - name: Offline research, Parquet, and DuckDB round trips
        run: python -m pytest tests/test_research_evaluation.py tests/test_research_core_evaluation.py -q
